---
# roles/nginx/tasks/main.yml — Install and configure Nginx as reverse proxy
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: yes

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Deploy Library Platform Nginx config
  ansible.builtin.template:
    src: library.conf.j2
    dest: /etc/nginx/sites-available/library
    mode: "0644"
  notify: Reload Nginx

- name: Enable Library Platform site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/library
    dest: /etc/nginx/sites-enabled/library
    state: link
  notify: Reload Nginx

- name: Ensure Nginx is started and enabled
  ansible.builtin.systemd:
    name: nginx
    enabled: yes
    state: started
