# nginx/library.conf — Standalone Nginx reverse-proxy configuration
# Use for production deployment on Ubuntu 22.04
# Copy to: /etc/nginx/sites-available/library
# Symlink: ln -s /etc/nginx/sites-available/library /etc/nginx/sites-enabled/library

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/library_access.log combined;
    error_log  /var/log/nginx/library_error.log warn;

    client_max_body_size 10M;

    # Serve static files directly for performance
    location /static/ {
        alias /opt/library-platform/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy all other requests to the Flask application
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
        proxy_connect_timeout 30;
        proxy_buffering    off;
    }

    # Health check — no logging for noise reduction
    location /api/health {
        proxy_pass http://127.0.0.1:5000/api/health;
        access_log off;
    }
}
